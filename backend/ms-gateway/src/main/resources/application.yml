server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:dayloom-local-dev-secret-min-32-chars-0123456789}
admin:
  tailnet-ips: ${ADMIN_TAILNET_IPS:100.64.0.0/10}
management:
  endpoints:
    web:
      exposure:
        include: health
spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ORIGINS:http://localhost:5173}
            allowedMethods: [GET, POST, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, X-Forwarded-For]
            allowCredentials: true
      routes:
        - id: identity
          uri: http://ms-identity-admin:8081
          predicates:
            - Path=/api/auth/**,/api/admin/**
        - id: habits
          uri: http://ms-habits:8082
          predicates:
            - Path=/api/time/**,/api/food/**
        - id: planner
          uri: http://ms-planner:8083
          predicates:
            - Path=/api/notes/**,/api/expenses/**
