services:
  ms-identity-admin:
    build: ./ms-identity-admin
    container_name: dayloom-identity
    expose:
      - "8081"
    environment:
      - MONGODB_URI=${MONGODB_URI_AUTHDB:-mongodb://mongo:27017/authdb}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SERVER_PORT=8081

  ms-habits:
    build: ./ms-habits
    container_name: dayloom-habits
    expose:
      - "8082"
    environment:
      - MONGODB_URI=${MONGODB_URI_HABITSDB:-mongodb://mongo:27017/habitsdb}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8082

  ms-planner:
    build: ./ms-planner
    container_name: dayloom-planner
    expose:
      - "8083"
    environment:
      - MONGODB_URI=${MONGODB_URI_PLANNERDB:-mongodb://mongo:27017/plannerdb}
      - JWT_SECRET=${JWT_SECRET}
      - SERVER_PORT=8083

  ms-gateway:
    build: ./ms-gateway
    container_name: dayloom-gateway
    ports:
      - "${TAILNET_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_TAILNET_IPS=${ADMIN_TAILNET_IPS:-100.64.0.0/10}
      - SERVER_PORT=8080
    depends_on:
      - ms-identity-admin
      - ms-habits
      - ms-planner
